<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#06134A">
  <meta name="description" content="SkyFlow · Tótem de autoservicio para check-in, pesaje de equipaje y pago.">
  <title>SkyFlow · Check-in</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="stage" class="stage" aria-busy="true">
    <header id="header" class="app-header" hidden></header>
    <main id="view" class="view"></main>
    <footer id="footer" class="app-footer" hidden></footer>
    <div id="fx" class="fx-layer" aria-hidden="true"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="modal" class="modal-root" hidden></div>
    <aside id="operator" class="operator" hidden aria-label="Panel de operador"></aside>
  </div>
  <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">Este tótem necesita JavaScript activado.</p></noscript>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
